version: 2
updates:
  # Maven dependencies (pom.xml) and the Maven wrapper (.mvn/wrapper)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      mongock:
        patterns:
          - "io.mongock*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major Spring Boot upgrades need manual migration work
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images referenced in compose.yaml (MongoDB)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"
